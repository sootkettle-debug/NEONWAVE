name: Build NEONWAVE for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate high-resolution Windows icon
        run: |
          python -m pip install Pillow
          python tools/create_icon.py
      - name: Restore
        run: dotnet restore NEONWAVE/NEONWAVE.csproj
      - name: Publish standalone x64 app
        run: dotnet publish NEONWAVE/NEONWAVE.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload NEONWAVE.exe
        uses: actions/upload-artifact@v4
        with:
          name: NEONWAVE-Windows-x64
          path: publish/NEONWAVE.exe
          if-no-files-found: error
          retention-days: 30